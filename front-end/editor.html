<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>街角情绪盲盒 · UI 编辑器</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-family-primary);
      background: var(--color-background);
      color: var(--color-ink);
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    /* 侧边页面列表 */
    .sidebar {
      background: var(--color-surface);
      backdrop-filter: var(--backdrop-glass);
      border-right: 1px solid var(--color-border);
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      overflow-y: auto;
    }
    .sidebar h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sidebar .sub { font-size: 12px; color: var(--color-ink-muted); margin-top: 4px; }
    .page-list { display: flex; flex-direction: column; gap: var(--space-xs); margin-top: var(--space-sm); }
    .page-item {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: 12px 14px;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      color: var(--color-ink-secondary);
      cursor: pointer;
      border: 1px solid transparent;
      transition: background 180ms var(--ease-soft), color 180ms var(--ease-soft);
    }
    .page-item:hover { background: var(--color-primary-subtle); }
    .page-item.active {
      background: var(--color-primary-subtle);
      color: var(--color-brand-dark);
      border-color: var(--color-border-strong);
    }
    .page-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-primary); flex-shrink: 0; }

    .tips {
      margin-top: auto;
      font-size: 11.5px;
      line-height: 1.6;
      color: var(--color-ink-muted);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 16px;
      padding: var(--space-md);
    }
    .tips b { color: var(--color-ink-secondary); font-weight: 600; }

    /* 主区域 */
    .main { display: flex; flex-direction: column; min-width: 0; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-surface);
      backdrop-filter: var(--backdrop-glass);
      flex-wrap: wrap;
    }
    .toolbar .spacer { flex: 1; }
    .toolbar .current { font-size: 13px; color: var(--color-ink-secondary); font-weight: 500; }

    .tbtn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 9999px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      color: var(--color-ink);
      cursor: pointer;
      transition: transform 160ms var(--ease-soft), background 160ms var(--ease-soft);
    }
    .tbtn:hover { background: var(--color-surface-elevated); }
    .tbtn:active { transform: scale(0.97); }
    .tbtn.primary { background: var(--color-primary); color: #fff; border-color: transparent; box-shadow: 0 4px 16px var(--shadow-color-primary); }
    .tbtn.danger { color: var(--color-error); }
    .tbtn:disabled { opacity: 0.5; cursor: not-allowed; }

    .stage {
      flex: 1;
      position: relative;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 30% 20%, var(--bg-orb-1) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, var(--bg-orb-2) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, var(--bg-orb-3) 0%, transparent 40%),
        linear-gradient(180deg, var(--color-background) 0%, var(--color-background-warm) 100%);
      overflow: hidden;
      padding: var(--space-lg);
    }
    .phone {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 880px;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: var(--shadow-2xl);
      background: var(--color-background);
      border: 1px solid var(--color-border);
    }
    iframe#preview {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    .badge-info {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 9999px;
      font-size: 12px; font-weight: 500;
      background: var(--color-success-bg); color: #3a6b5c;
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div>
      <h1>UI 编辑器</h1>
      <p class="sub">街角情绪盲盒 · 设计稿可视化编辑</p>
    </div>
    <nav class="page-list" id="page-list">
      <div class="page-item" data-page="index.html"><span class="dot"></span>情绪罗盘首页</div>
      <div class="page-item" data-page="pickup.html"><span class="dot"></span>微光卡片拾取</div>
      <div class="page-item" data-page="release.html"><span class="dot"></span>种下温柔盲盒</div>
      <div class="page-item" data-page="footprint.html"><span class="dot"></span>温柔足迹空间</div>
      <div class="page-item" data-page="me.html"><span class="dot"></span>我的 · 个人中心</div>
      <div class="page-item" data-page="settings.html"><span class="dot"></span>设置</div>
    </nav>
    <div class="tips">
      <b>编辑方式</b><br>
      • 点击任意文字即可直接修改<br>
      • 点击图片可替换为本地图片<br>
      • 输入框可输入文字，<b>双击</b>编辑占位提示<br>
      • 改动自动保存到浏览器本地<br>
      • 导出为独立 HTML，保留全部样式与交互
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <button class="tbtn" id="btn-toggle">退出编辑</button>
      <button class="tbtn primary" id="btn-export">导出当前页</button>
      <button class="tbtn" id="btn-export-all">导出全部</button>
      <button class="tbtn danger" id="btn-reset">重置改动</button>
      <span class="spacer"></span>
      <span class="current" id="current-label">情绪罗盘首页</span>
      <span class="badge-info" id="status-badge">编辑模式已开启</span>
    </div>
    <div class="stage">
      <div class="phone">
        <iframe id="preview" src="index.html?edit=1" title="预览"></iframe>
      </div>
    </div>
  </main>

  <script>
    (function () {
      'use strict';
      const PAGES = ['index.html', 'pickup.html', 'release.html', 'footprint.html', 'me.html', 'settings.html'];
      const LABELS = {
        'index.html': '情绪罗盘首页',
        'pickup.html': '微光卡片拾取',
        'release.html': '种下温柔盲盒',
        'footprint.html': '温柔足迹空间',
        'me.html': '我的 · 个人中心',
        'settings.html': '设置'
      };
      const iframe = document.getElementById('preview');
      const btnToggle = document.getElementById('btn-toggle');
      const btnExport = document.getElementById('btn-export');
      const btnExportAll = document.getElementById('btn-export-all');
      const btnReset = document.getElementById('btn-reset');
      const currentLabel = document.getElementById('current-label');
      const statusBadge = document.getElementById('status-badge');
      const pageItems = Array.from(document.querySelectorAll('.page-item'));

      let editing = true;
      let current = 'index.html';
      let exportResolver = null;
      let busy = false;

      function setActivePage(name) {
        current = name;
        pageItems.forEach(it => it.classList.toggle('active', it.dataset.page === name));
        currentLabel.textContent = LABELS[name] || name;
      }

      function loadPage(name) {
        return new Promise(resolve => {
          const handler = function () {
            iframe.removeEventListener('load', handler);
            setTimeout(resolve, 380); // 等待 editor-injected 应用已存改动
          };
          iframe.addEventListener('load', handler);
          iframe.src = name + '?edit=1';
        });
      }

      function post(type) {
        iframe.contentWindow.postMessage({ type: type, source: 'ui-editor-shell' }, '*');
      }

      function download(page, html) {
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = page.replace('.html', '.edited.html');
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function setEditing(on) {
        editing = on;
        btnToggle.textContent = on ? '退出编辑' : '进入编辑';
        statusBadge.textContent = on ? '编辑模式已开启' : '预览模式（只读）';
        btnExport.disabled = !on;
        post(on ? 'UI_EDIT_ENABLE' : 'UI_EDIT_DISABLE');
      }

      // 侧边切换
      pageItems.forEach(it => {
        it.addEventListener('click', async () => {
          if (busy) return;
          busy = true;
          setActivePage(it.dataset.page);
          await loadPage(it.dataset.page);
          setEditing(true);
          busy = false;
        });
      });

      // 工具条
      btnToggle.addEventListener('click', () => setEditing(!editing));

      btnExport.addEventListener('click', () => {
        if (!editing) return;
        post('UI_EXPORT');
      });

      btnExportAll.addEventListener('click', async () => {
        if (busy) return;
        busy = true;
        btnExportAll.disabled = true;
        for (const p of PAGES) {
          setActivePage(p);
          await loadPage(p);
          post('UI_EXPORT');
          await waitExport(p);
        }
        btnExportAll.disabled = false;
        busy = false;
        statusBadge.textContent = '已全部导出 6 个页面';
      });

      btnReset.addEventListener('click', () => {
        if (!confirm('确定重置当前页面的所有编辑改动吗？此操作不可撤销。')) return;
        post('UI_RESET');
        // iframe 内会自动 reload，这里重新加载以恢复初始状态
        setTimeout(() => { loadPage(current).then(() => setEditing(true)); }, 600);
      });

      function waitExport(page) {
        return new Promise(resolve => {
          exportResolver = (p) => { if (p === page) resolve(); };
        });
      }

      // 接收 iframe 消息
      window.addEventListener('message', (e) => {
        const m = e.data;
        if (!m || m.source !== 'ui-editor') return;
        if (m.type === 'UI_READY') {
          statusBadge.textContent = '编辑模式已开启';
        } else if (m.type === 'UI_EXPORT_RESULT') {
          download(m.page, m.html);
          if (exportResolver) { exportResolver(m.page); exportResolver = null; }
        }
      });

      // 初始
      setActivePage('index.html');
      setEditing(true);
    })();
  </script>
</body>
</html>
