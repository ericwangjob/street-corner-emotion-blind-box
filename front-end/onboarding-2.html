<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F8F6FC">
  <title>街角情绪盲盒 · 功能引导</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .onb2 {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, var(--bg-orb-1) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, var(--bg-orb-2) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, var(--bg-orb-3) 0%, transparent 40%),
        linear-gradient(180deg, var(--color-background) 0%, var(--color-background-warm) 100%);
      padding: calc(env(safe-area-inset-top, 12px) + var(--space-lg)) 0 calc(var(--safe-bottom) + var(--space-xl));
    }

    /* 顶部：返回 + 进度点 */
    .onb2-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 var(--space-lg);
      height: 44px;
    }
    .onb2-back {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: var(--type-body);
      font-weight: 500;
      color: var(--color-ink-secondary);
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      backdrop-filter: var(--backdrop-glass);
      -webkit-backdrop-filter: var(--backdrop-glass);
      border-radius: 9999px;
      padding: 8px 16px 8px 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms var(--ease-soft);
    }
    .onb2-back.show { opacity: 1; pointer-events: auto; }
    .onb2-back:active { background: var(--color-surface-elevated); }

    .onb2-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: var(--space-md); }
    .onb2-dot {
      width: 8px; height: 8px;
      border-radius: 9999px;
      background: var(--color-ink-subtle);
      transition: width 250ms var(--ease-soft), background 250ms var(--ease-soft);
    }
    .onb2-dot.active {
      width: 24px;
      background: var(--color-primary);
    }

    /* 滑屏区 */
    .swiper {
      flex: 1;
      overflow: hidden;
      touch-action: pan-y;
    }
    .swiper-track {
      display: flex;
      height: 100%;
      transition: transform 250ms cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .swiper-track.dragging { transition: none; }
    .swiper-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      text-align: center;
      padding: 60px var(--space-lg) 0;
      gap: var(--space-lg);
    }
    .slide-orb {
      width: 140px; height: 140px;
      border-radius: 44px;
      display: grid; place-items: center;
      font-size: 64px;
      box-shadow: var(--shadow-lg), var(--shadow-glow);
      animation: float 4s ease-in-out infinite;
    }
    .slide-orb.c1 { background: linear-gradient(135deg, #B8A9E8 0%, #C9BCE8 100%); }
    .slide-orb.c2 { background: linear-gradient(135deg, #F8C9B0 0%, #FFE5D9 100%); }
    .slide-orb.c3 { background: linear-gradient(135deg, #B8D4F0 0%, #D8E1E9 100%); }
    .slide-title {
      font-size: var(--type-h1);
      font-weight: 700;
      color: var(--color-ink);
    }
    .slide-line {
      font-size: var(--type-body-lg);
      line-height: 1.7;
      color: var(--color-ink-secondary);
      max-width: 16em;
    }
    .slide-line strong { color: var(--color-brand-dark); font-weight: 600; }

    /* 底部：进度点 + 按钮 */
    .onb2-bottom {
      padding: var(--space-lg) var(--space-lg) 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    /* 暖橙按钮文字钉死白色，覆盖 design-system 的暗色规则 */
    .btn-warm,
    html.dark .btn-warm { color: #FFFFFF !important; }
    .btn-warm {
      background: linear-gradient(135deg, #F7A76C 0%, #F8C6A0 100%);
      box-shadow: 0 6px 20px rgba(246, 162, 118, 0.40);
    }
    .btn-warm:hover { filter: brightness(1.03); }
    .btn-warm:active { transform: scale(0.98); }

    @media (prefers-reduced-motion: reduce) {
      .slide-orb { animation: none; }
    }
  </style>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('xj_theme_mode') || 'system';
        var dark = (m === 'dark') || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme-mode', m);
      } catch (e) {}
    })();
  </script>
</head>
<body class="onb2">
  <!-- 顶部：返回 -->
  <div class="onb2-top">
    <button class="onb2-back" id="backBtn" aria-label="返回上一屏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      返回
    </button>
    <span aria-hidden="true"></span>
  </div>

  <!-- 滑屏 -->
  <div class="swiper" id="swiper">
    <div class="swiper-track" id="track">
      <section class="swiper-slide">
        <div class="slide-orb c1">🧭</div>
        <h2 class="slide-title">情绪罗盘</h2>
        <p class="slide-line">打开就是安静的<strong>情绪地图</strong><br>顺手发现附近的温柔</p>
      </section>
      <section class="swiper-slide">
        <div class="slide-orb c2">📍</div>
        <h2 class="slide-title">近场拾取</h2>
        <p class="slide-line">路过就能<strong>拾起一份温柔</strong><br>陌生人的善意正在等你</p>
      </section>
      <section class="swiper-slide">
        <div class="slide-orb c3">🍃</div>
        <h2 class="slide-title">转角释放</h2>
        <p class="slide-line">把心事<strong>轻轻放下</strong><br>让情绪随风慢慢散开</p>
      </section>
    </div>
  </div>

  <!-- 底部：进度点 + 按钮 -->
  <div class="onb2-bottom">
    <div class="onb2-dots" aria-hidden="true">
      <span class="onb2-dot active"></span>
      <span class="onb2-dot"></span>
      <span class="onb2-dot"></span>
    </div>
    <button class="btn btn-warm btn-block" id="nextBtn" data-action="enter">下一步</button>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script>
    (function () {
      var total = 3;
      var index = 0;
      var track = document.getElementById('track');
      var dots = Array.prototype.slice.call(document.querySelectorAll('.onb2-dot'));
      var backBtn = document.getElementById('backBtn');
      var nextBtn = document.getElementById('nextBtn');

      function render() {
        track.style.transform = 'translateX(' + (-index * 100) + '%)';
        dots.forEach(function (d, i) { d.classList.toggle('active', i === index); });
        backBtn.classList.toggle('show', index > 0);
        nextBtn.textContent = (index === total - 1) ? '进入街角' : '下一步';
      }

      function goTo(i) {
        index = Math.max(0, Math.min(total - 1, i));
        render();
      }

      backBtn.addEventListener('click', function () { goTo(index - 1); });

      nextBtn.addEventListener('click', function () {
        if (index < total - 1) {
          goTo(index + 1);
        } else {
          // 末屏：完成引导 → 授权判断页
          try { localStorage.setItem('onboarding_done', '1'); } catch (e) {}
          window.location.href = 'auth.html';
        }
      });

      // 触摸滑动（与按钮统一的动效曲线）
      var swiper = document.getElementById('swiper');
      var startX = 0, startY = 0, deltaX = 0, dragging = false, decided = false;

      swiper.addEventListener('touchstart', function (e) {
        if (e.touches.length !== 1) return;
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        deltaX = 0; dragging = true; decided = false;
        track.classList.add('dragging');
      }, { passive: true });

      swiper.addEventListener('touchmove', function (e) {
        if (!dragging) return;
        var dx = e.touches[0].clientX - startX;
        var dy = e.touches[0].clientY - startY;
        if (!decided) {
          // 纵向滚动优先，交给浏览器
          if (Math.abs(dy) > Math.abs(dx)) { dragging = false; track.classList.remove('dragging'); return; }
          decided = true;
        }
        // 边界阻尼
        if ((index === 0 && dx > 0) || (index === total - 1 && dx < 0)) dx *= 0.35;
        deltaX = dx;
        track.style.transform = 'translateX(' + (-index * 100 + (dx / swiper.clientWidth) * 100) + '%)';
      }, { passive: true });

      swiper.addEventListener('touchend', function () {
        if (!dragging) return;
        dragging = false;
        track.classList.remove('dragging');
        var threshold = swiper.clientWidth * 0.18;
        if (deltaX <= -threshold) goTo(index + 1);
        else if (deltaX >= threshold) goTo(index - 1);
        else render();
      });

      render();
    })();
  </script>
</body>
</html>
