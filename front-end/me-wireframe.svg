<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="-apple-system, 'PingFang SC', 'Segoe UI', sans-serif">
  <!-- ============================================================
       「我的」Tab 低 fidelity 线框图
       手机基准 375×812 | 灰盒 + 占位文字 + design token 注释
       对应文档：me-tab-content.md
       ============================================================ -->

  <!-- 设备外框 -->
  <rect x="10" y="10" width="355" height="792" rx="40" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="2"/>

  <!-- 1. 状态栏占位 -->
  <g stroke="none" fill="#BBBBBB">
    <rect x="28" y="22" width="40" height="10" rx="3"/>
    <rect x="300" y="22" width="48" height="10" rx="3"/>
  </g>

  <!-- 2. Header: 双语标题 (token: .page-title) -->
  <text x="187" y="74" text-anchor="middle" fill="#888888" font-size="13" letter-spacing="2">MY PROFILE</text>
  <text x="187" y="98" text-anchor="middle" fill="#555555" font-size="22" font-weight="600">我的</text>
  <!-- 右侧占位，平衡三栏 -->

  <!-- 分隔细线 -->
  <line x1="25" y1="116" x2="350" y2="116" stroke="#EEEEEE" stroke-width="1"/>

  <!-- 3. Profile card (token: .card-glass) -->
  <rect x="25" y="128" width="325" height="112" rx="18" fill="#F7F7F9" stroke="#D9D9E0" stroke-width="1.5"/>
  <!-- 系统渐变头像 (不可编辑) -->
  <circle cx="78" cy="184" r="34" fill="#E8E3F5" stroke="#D2CBEA" stroke-width="1.5"/>
  <text x="78" y="189" text-anchor="middle" fill="#999999" font-size="10">头像</text>
  <!-- 温柔代号 (系统生成, 不可自定义) -->
  <rect x="128" y="160" width="180" height="14" rx="4" fill="#E4E4E8"/>
  <text x="132" y="171" fill="#777777" font-size="12">温柔代号（系统生成）</text>
  <!-- 一行轻标签 (无统计/天数/排行) -->
  <rect x="128" y="190" width="200" height="12" rx="4" fill="#EDEDF0"/>
  <text x="132" y="200" fill="#999999" font-size="11">城市散步者 · 顺路收发温柔</text>
  <!-- ❌ 移除：可编辑昵称 / 统计数字行 -->

  <!-- 4. 温柔足迹预览 (合并 PRD 三大块) -->
  <text x="28" y="268" fill="#666666" font-size="13" font-weight="600">温柔足迹预览</text>

  <!-- 3.1 情绪时间线 (周视图) -->
  <rect x="25" y="280" width="325" height="62" rx="14" fill="#F7F7F9" stroke="#D9D9E0" stroke-width="1.2"/>
  <rect x="42" y="298" width="120" height="12" rx="4" fill="#E4E4E8"/>
  <text x="46" y="308" fill="#888888" font-size="11">情绪时间线（周视图）</text>
  <rect x="42" y="318" width="220" height="10" rx="3" fill="#EDEDF0"/>
  <text x="300" y="318" fill="#A99FD6" font-size="11" text-anchor="end">查看全部 →</text>

  <!-- 3.2 AIGC 水彩生成图卷 -->
  <rect x="25" y="350" width="325" height="62" rx="14" fill="#F7F7F9" stroke="#D9D9E0" stroke-width="1.2"/>
  <rect x="42" y="368" width="120" height="12" rx="4" fill="#E4E4E8"/>
  <text x="46" y="378" fill="#888888" font-size="11">AIGC 水彩图卷</text>
  <rect x="42" y="388" width="220" height="10" rx="3" fill="#EDEDF0"/>
  <text x="300" y="388" fill="#A99FD6" font-size="11" text-anchor="end">查看全部 →</text>

  <!-- 3.3 离散余音 (PRD 缺口, 待确认) -->
  <rect x="25" y="420" width="325" height="62" rx="14" fill="#FBF7F2" stroke="#EAD9C4" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="42" y="438" width="120" height="12" rx="4" fill="#F0E6D8"/>
  <text x="46" y="448" fill="#9A8A6E" font-size="11">离散余音 ⚠ 待确认</text>
  <rect x="42" y="458" width="220" height="10" rx="3" fill="#F5EDE2"/>
  <text x="300" y="458" fill="#A99FD6" font-size="11" text-anchor="end">查看全部 →</text>

  <!-- 5. 常用功能 (token: .func-list / .func-row) -->
  <text x="28" y="510" fill="#666666" font-size="13" font-weight="600">常用功能</text>
  <g stroke="#E2E2E6" stroke-width="1" fill="#FAFAFB">
    <rect x="25" y="522" width="325" height="42" rx="12"/>
    <rect x="25" y="572" width="325" height="42" rx="12"/>
    <rect x="25" y="622" width="325" height="42" rx="12"/>
    <rect x="25" y="672" width="325" height="42" rx="12"/>
    <rect x="25" y="722" width="325" height="42" rx="12"/>
  </g>
  <g fill="#888888" font-size="12">
    <text x="44" y="547">我的温柔足迹</text>
    <text x="44" y="597">隐私与数据（PIPL 删除入口）</text>
    <text x="44" y="647">设置</text>
    <text x="44" y="697">关于街角情绪盲盒</text>
    <text x="44" y="747" fill="#C97A7A">退出登录</text>
  </g>
  <g fill="#CCCCCC" font-size="14" text-anchor="end">
    <text x="338" y="547">›</text>
    <text x="338" y="597">›</text>
    <text x="338" y="647">›</text>
    <text x="338" y="697">›</text>
    <text x="338" y="747">›</text>
  </g>

  <!-- 6. 底部 Tab 栏 (我的 = active) -->
  <line x1="10" y1="786" x2="365" y2="786" stroke="#EEEEEE" stroke-width="1"/>
  <rect x="10" y="786" width="355" height="16" fill="#FFFFFF"/>
  <g text-anchor="middle" font-size="11">
    <text x="78" y="804" fill="#AAAAAA">罗盘</text>
    <text x="187" y="804" fill="#AAAAAA">足迹</text>
    <!-- active 高亮 -->
    <rect x="262" y="792" width="50" height="20" rx="10" fill="#E8E3F5"/>
    <text x="287" y="804" fill="#7A6FB8" font-weight="600">我的</text>
  </g>

  <!-- ============================================================
       注释：深色模式沿用 html.dark token 覆盖，不在此硬编码配色。
       ============================================================ -->
</svg>
