<main data-name="Home-Compass" class="flex flex-col justify-start items-center w-[375px] min-h-[812px] bg-[linear-gradient(180deg,#E8E0F7_0%,#FADADD_45%,#FCE8DE_100%)] p-[24px] gap-[24px]" style="font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 状态栏占位 -->
  <div data-name="status-bar" class="flex flex-row justify-center items-center w-[327px] h-[24px]"></div>

  <!-- 顶部导航 -->
  <header data-name="header" class="flex flex-row justify-between items-center w-[327px]">
    <div data-name="header-spacer" class="w-[44px] h-[44px] rounded-[44px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)]"></div>
    <div data-name="top-pill" class="flex flex-row justify-center items-center gap-[8px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] rounded-[9999px] p-[8px]">
      <i data-name="pill-icon" class="fas fa-map-marker-alt text-[14px] text-[#5A4A8A]"></i>
      <span data-name="pill-text" class="text-[12px] leading-[16px] font-[500] text-[#54545A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">清晨散步 · 上海</span>
    </div>
    <div data-name="btn-settings" class="flex flex-row justify-center items-center w-[44px] h-[44px] rounded-[44px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)]">
      <i data-name="settings-icon" class="fas fa-cog text-[20px] text-[#2C2C2E]"></i>
    </div>
  </header>

  <!-- 英雄区 -->
  <section data-name="hero" class="flex flex-col justify-start items-center w-[327px] gap-[8px]">
    <span data-name="hero-nano" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center tracking-[0.5px] uppercase" style="font-family:'Inter','PingFang SC',sans-serif">WELCOME, 散步者</span>
    <h1 data-name="hero-title" class="text-[36px] leading-[40px] font-[700] text-[#2C2C2E] text-center" style="font-family:'Inter','PingFang SC',sans-serif">街角情绪盲盒</h1>
    <p data-name="hero-subtitle" class="text-[15px] leading-[24px] font-[400] text-[#54545A] text-center">把 15 分钟步行圈<br>变成有温度的情绪空间</p>
  </section>

  <!-- 情绪罗盘画布 -->
  <section data-name="compass-canvas" class="relative flex flex-col justify-center items-center w-[280px] h-[280px] rounded-[280px] bg-[radial-gradient(circle_at_center,rgba(184,169,232,0.28)_0%,rgba(184,169,232,0.06)_60%,transparent_100%)] gap-[8px]">
    <div data-name="ripple-ring-1" class="absolute w-[200px] h-[200px] rounded-[200px] border-[1px] border-[rgba(184,169,232,0.18)]"></div>
    <div data-name="ripple-ring-2" class="absolute w-[200px] h-[200px] rounded-[200px] border-[1px] border-[rgba(248,201,176,0.20)]"></div>
    <div data-name="ripple-ring-3" class="absolute w-[200px] h-[200px] rounded-[200px] border-[1px] border-[rgba(184,212,240,0.18)]"></div>
    <div data-name="compass-center" class="relative flex flex-row justify-center items-center w-[72px] h-[72px] rounded-[72px] bg-[linear-gradient(135deg,#FFFFFF_0%,#F5F1FA_100%)] shadow-[0_8px_32px_rgba(120,104,168,0.10),0_0_24px_rgba(184,169,232,0.28)]">
      <i data-name="center-icon" class="fas fa-map-marker-alt text-[28px] text-[#B8A9E8]"></i>
    </div>
  </section>
  <span data-name="compass-scope" class="flex flex-row justify-center items-center gap-[4px] w-[fit] p-[4px] rounded-[999px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] text-[12px] leading-[16px] font-[400] text-[#54545A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">
    <span data-name="scope-dot" class="w-[6px] h-[6px] rounded-[6px] bg-[#B8A9E8]"></span>
    15min 步行圈 · 点击切换近场
  </span>

  <!-- 底部信息卡片 -->
  <section data-name="nearby-card" class="flex flex-col justify-start items-center w-[327px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] rounded-[24px] p-[24px] gap-[12px] shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
    <span data-name="nearby-nano" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center tracking-[0.5px] uppercase" style="font-family:'Inter','PingFang SC',sans-serif">NEARBY</span>
    <h2 data-name="nearby-title" class="text-[24px] leading-[30px] font-[700] text-[#2C2C2E] text-center" style="font-family:'Inter','PingFang SC',sans-serif">附近还有 <span data-name="nearby-count" class="text-[24px] leading-[30px] font-[700] text-[#B8A9E8] text-center" style="font-family:'Inter','PingFang SC',sans-serif">3</span> 份温柔</h2>
    <p data-name="nearby-caption" class="text-[12px] leading-[18px] font-[400] text-[#54545A] text-center">继续散步，靠近光点时手机会轻轻震动</p>
    <div data-name="btn-pickup" class="flex flex-row justify-center items-center gap-[8px] w-[279px] h-[48px] rounded-[9999px] bg-[#B8A9E8] shadow-[0_4px_16px_rgba(120,104,168,0.12)]">
      <i data-name="pickup-icon" class="fas fa-shield-alt text-[18px] text-[#FFFFFF]"></i>
      <span data-name="pickup-text" class="text-[15px] leading-[20px] font-[600] text-[#FFFFFF] text-center" style="font-family:'Inter','PingFang SC',sans-serif">去拾取温柔</span>
    </div>
  </section>

  <!-- 浮动发布按钮 -->
  <div data-name="fab-release" class="absolute flex flex-row justify-center items-center w-[56px] h-[56px] rounded-[56px] bg-[#B8A9E8] shadow-[0_8px_32px_rgba(120,104,168,0.10),0_0_24px_rgba(184,169,232,0.28)]" style="right:24px; bottom:120px;">
    <i data-name="fab-icon" class="fas fa-plus text-[24px] text-[#FFFFFF]"></i>
  </div>

  <!-- 底部 Tab 栏 -->
  <nav data-name="tab-bar" class="flex flex-row justify-between items-center w-[327px] h-[64px] rounded-[32px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[8px] shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
    <div data-name="tab-compass-active" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-compass-icon" class="fas fa-map-marker-alt text-[24px] text-[#5A4A8A]"></i>
      <span data-name="tab-compass-label" class="text-[11px] leading-[14px] font-[500] text-[#5A4A8A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">罗盘</span>
    </div>
    <div data-name="tab-footprint" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-footprint-icon" class="fas fa-book text-[24px] text-[#8A8A90]"></i>
      <span data-name="tab-footprint-label" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">足迹</span>
    </div>
    <div data-name="tab-me" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-me-icon" class="fas fa-user text-[24px] text-[#8A8A90]"></i>
      <span data-name="tab-me-label" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">我的</span>
    </div>
  </nav>
</main>
