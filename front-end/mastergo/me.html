<main data-name="Me-Profile" class="flex flex-col justify-start items-center w-[375px] min-h-[812px] bg-[linear-gradient(180deg,#FCFAF7_0%,#F9F1EC_100%)] p-[24px] gap-[32px]" style="font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif">
  <!-- 状态栏占位 -->
  <div data-name="status-bar" class="flex flex-row justify-center items-center w-[327px] h-[24px]"></div>

  <!-- 顶部栏 -->
  <header data-name="header" class="flex flex-row justify-between items-center w-[327px]">
    <div data-name="top-pill" class="flex flex-row justify-center items-center rounded-[9999px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[8px]">
      <span data-name="pill-text" class="text-[12px] leading-[16px] font-[500] text-[#54545A] text-center tracking-[0.5px] uppercase" style="font-family:'Inter','PingFang SC',sans-serif">MY PROFILE</span>
    </div>
    <div data-name="btn-settings" class="flex flex-row justify-center items-center w-[44px] h-[44px] rounded-[44px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)]">
      <i data-name="settings-icon" class="fas fa-cog text-[20px] text-[#2C2C2E]"></i>
    </div>
  </header>

  <!-- 用户信息卡片 -->
  <section data-name="user-card" class="flex flex-col justify-start items-center w-[327px] rounded-[24px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[24px] gap-[12px] shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
    <div data-name="avatar-btn" class="relative flex flex-row justify-center items-center w-[88px] h-[88px] rounded-[88px] bg-[linear-gradient(135deg,#B8A9E8_0%,#F8C9B0_100%)] shadow-[0_8px_32px_rgba(120,104,168,0.10),0_0_24px_rgba(184,169,232,0.28)]">
      <i data-name="avatar-icon" class="fas fa-user text-[34px] text-[#FFFFFF]"></i>
      <div data-name="avatar-badge" class="absolute flex flex-row justify-center items-center w-[28px] h-[28px] rounded-[28px] bg-[#FFFFFF] border-[2px] border-[#FFFFFF]" style="right:2px; bottom:2px;">
        <i data-name="badge-camera" class="fas fa-camera text-[14px] text-[#5A4A8A]"></i>
      </div>
    </div>
    <div data-name="nickname-edit" class="flex flex-row justify-center items-center gap-[8px]">
      <span data-name="nickname" class="text-[24px] leading-[30px] font-[700] text-[#2C2C2E] text-center" style="font-family:'Inter','PingFang SC',sans-serif">晚风散步者</span>
      <i data-name="edit-icon" class="fas fa-pen text-[18px] text-[#8A8A90]"></i>
    </div>
    <p data-name="user-code" class="text-[12px] leading-[18px] font-[400] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">温柔代号 · 一位路过的风打理人</p>

    <div data-name="stat-row" class="flex flex-row justify-start items-stretch gap-[12px] w-[279px] mt-[16px]">
      <div data-name="stat-collect" class="flex flex-col justify-start items-center gap-[4px] flex-1 rounded-[20px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[16px]">
        <span data-name="collect-num" class="text-[24px] leading-[30px] font-[700] text-[#5A4A8A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">12</span>
        <span data-name="collect-label" class="text-[12px] leading-[16px] font-[400] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">收藏</span>
      </div>
      <div data-name="stat-view" class="flex flex-col justify-start items-center gap-[4px] flex-1 rounded-[20px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[16px]">
        <span data-name="view-num" class="text-[24px] leading-[30px] font-[700] text-[#5A4A8A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">48</span>
        <span data-name="view-label" class="text-[12px] leading-[16px] font-[400] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">浏览</span>
      </div>
      <div data-name="stat-buy" class="flex flex-col justify-start items-center gap-[4px] flex-1 rounded-[20px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[16px]">
        <span data-name="buy-num" class="text-[24px] leading-[30px] font-[700] text-[#5A4A8A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">3</span>
        <span data-name="buy-label" class="text-[12px] leading-[16px] font-[400] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">已购</span>
      </div>
    </div>
  </section>

  <!-- 功能入口 -->
  <section data-name="func-section" class="flex flex-col justify-start items-stretch w-[327px] gap-[16px]">
    <h2 data-name="func-title" class="text-[18px] leading-[24px] font-[600] text-[#2C2C2E] text-left" style="font-family:'Inter','PingFang SC',sans-serif">常用功能</h2>
    <div data-name="func-list" class="flex flex-col justify-start items-stretch w-[327px] rounded-[24px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] overflow-hidden shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
      <div data-name="func-row-1" class="flex flex-row justify-start items-center gap-[16px] w-[327px] p-[16px] border-b-[1px] border-[rgba(120,108,160,0.10)]">
        <div data-name="func-icon-1" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[13px] bg-[rgba(184,169,232,0.16)]"><i data-name="fi-1" class="fas fa-user text-[20px] text-[#5A4A8A]"></i></div>
        <span data-name="func-label-1" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left flex-1" style="font-family:'Inter','PingFang SC',sans-serif">个人资料编辑</span>
        <i data-name="chevron-1" class="fas fa-chevron-right text-[18px] text-[rgba(44,44,46,0.24)]"></i>
      </div>
      <div data-name="func-row-2" class="flex flex-row justify-start items-center gap-[16px] w-[327px] p-[16px] border-b-[1px] border-[rgba(120,108,160,0.10)]">
        <div data-name="func-icon-2" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[13px] bg-[rgba(184,169,232,0.16)]"><i data-name="fi-2" class="fas fa-shield-alt text-[20px] text-[#5A4A8A]"></i></div>
        <span data-name="func-label-2" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left flex-1" style="font-family:'Inter','PingFang SC',sans-serif">账号安全设置</span>
        <i data-name="chevron-2" class="fas fa-chevron-right text-[18px] text-[rgba(44,44,46,0.24)]"></i>
      </div>
      <div data-name="func-row-3" class="flex flex-row justify-start items-center gap-[16px] w-[327px] p-[16px] border-b-[1px] border-[rgba(120,108,160,0.10)]">
        <div data-name="func-icon-3" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[13px] bg-[rgba(184,169,232,0.16)]"><i data-name="fi-3" class="fas fa-bell text-[20px] text-[#5A4A8A]"></i></div>
        <span data-name="func-label-3" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left flex-1" style="font-family:'Inter','PingFang SC',sans-serif">消息通知中心</span>
        <i data-name="chevron-3" class="fas fa-chevron-right text-[18px] text-[rgba(44,44,46,0.24)]"></i>
      </div>
      <div data-name="func-row-4" class="flex flex-row justify-start items-center gap-[16px] w-[327px] p-[16px] border-b-[1px] border-[rgba(120,108,160,0.10)]">
        <div data-name="func-icon-4" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[13px] bg-[rgba(184,169,232,0.16)]"><i data-name="fi-4" class="fas fa-file-alt text-[20px] text-[#5A4A8A]"></i></div>
        <span data-name="func-label-4" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left flex-1" style="font-family:'Inter','PingFang SC',sans-serif">我的订单 / 订阅</span>
        <i data-name="chevron-4" class="fas fa-chevron-right text-[18px] text-[rgba(44,44,46,0.24)]"></i>
      </div>
      <div data-name="func-row-5" class="flex flex-row justify-start items-center gap-[16px] w-[327px] p-[16px]">
        <div data-name="func-icon-5" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[13px] bg-[rgba(184,169,232,0.16)]"><i data-name="fi-5" class="fas fa-cog text-[20px] text-[#5A4A8A]"></i></div>
        <span data-name="func-label-5" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left flex-1" style="font-family:'Inter','PingFang SC',sans-serif">设置</span>
        <i data-name="chevron-5" class="fas fa-chevron-right text-[18px] text-[rgba(44,44,46,0.24)]"></i>
      </div>
    </div>
  </section>

  <!-- 最近活动 -->
  <section data-name="activity-section" class="flex flex-col justify-start items-stretch w-[327px] gap-[16px]">
    <h2 data-name="activity-title" class="text-[18px] leading-[24px] font-[600] text-[#2C2C2E] text-left" style="font-family:'Inter','PingFang SC',sans-serif">最近活动</h2>
    <div data-name="activity-card" class="flex flex-col justify-start items-stretch w-[327px] rounded-[24px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[24px] gap-[16px] shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
      <div data-name="activity-item" class="flex flex-row justify-start items-center gap-[16px] w-[279px] pb-[16px] border-b-[1px] border-[rgba(120,108,160,0.10)]">
        <div data-name="activity-icon" class="flex flex-row justify-center items-center w-[40px] h-[40px] rounded-[14px] bg-[rgba(254,206,182,0.72)]"><i data-name="ai-1" class="fas fa-heart text-[20px] text-[#9A6A50]"></i></div>
        <div data-name="activity-body" class="flex flex-col justify-start items-start gap-[2px] flex-1">
          <span data-name="activity-text" class="text-[15px] leading-[20px] font-[500] text-[#2C2C2E] text-left" style="font-family:'Inter','PingFang SC',sans-serif">接收了一份暖意盲盒</span>
          <span data-name="activity-time" class="text-[12px] leading-[16px] font-[400] text-[#8A8A90] text-left" style="font-family:'Inter','PingFang SC',sans-serif">今天 17:20</span>
        </div>
      </div>
      <div data-name="activity-loader" class="flex flex-row justify-center items-center gap-[8px] w-[279px]">
        <span data-name="loader-text" class="text-[12px] leading-[16px] font-[400] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">加载中…</span>
      </div>
    </div>
  </section>

  <!-- 退出登录 -->
  <div data-name="btn-logout" class="flex flex-row justify-center items-center w-[327px] h-[48px] rounded-[9999px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(224,154,154,0.40)]">
    <span data-name="logout-text" class="text-[15px] leading-[20px] font-[600] text-[#E09A9A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">退出登录</span>
  </div>

  <!-- 底部 Tab 栏 -->
  <nav data-name="tab-bar" class="flex flex-row justify-between items-center w-[327px] h-[64px] rounded-[32px] bg-[rgba(255,255,255,0.72)] border-[1px] border-[rgba(120,108,160,0.16)] p-[8px] shadow-[0_8px_32px_rgba(120,104,168,0.10)]">
    <div data-name="tab-compass" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-compass-icon" class="fas fa-map-marker-alt text-[24px] text-[#8A8A90]"></i>
      <span data-name="tab-compass-label" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">罗盘</span>
    </div>
    <div data-name="tab-footprint" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-footprint-icon" class="fas fa-book text-[24px] text-[#8A8A90]"></i>
      <span data-name="tab-footprint-label" class="text-[11px] leading-[14px] font-[500] text-[#8A8A90] text-center" style="font-family:'Inter','PingFang SC',sans-serif">足迹</span>
    </div>
    <div data-name="tab-me-active" class="flex flex-col justify-center items-center gap-[2px] w-[90px] h-[48px]">
      <i data-name="tab-me-icon" class="fas fa-user text-[24px] text-[#5A4A8A]"></i>
      <span data-name="tab-me-label" class="text-[11px] leading-[14px] font-[500] text-[#5A4A8A] text-center" style="font-family:'Inter','PingFang SC',sans-serif">我的</span>
    </div>
  </nav>
</main>
