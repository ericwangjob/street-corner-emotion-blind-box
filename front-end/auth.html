<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F8F6FC">
  <title>街角情绪盲盒 · 进入街角</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .auth {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 20%, var(--bg-orb-1) 0%, transparent 50%),
        radial-gradient(circle at 70% 60%, var(--bg-orb-2) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, var(--bg-orb-3) 0%, transparent 40%),
        linear-gradient(180deg, var(--color-background) 0%, var(--color-background-warm) 100%);
      padding: calc(env(safe-area-inset-top, 12px) + var(--space-3xl)) var(--space-lg) calc(var(--safe-bottom) + var(--space-xl));
    }

    .auth-head { text-align: center; margin-bottom: var(--space-xl); }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--color-primary-subtle);
      color: var(--color-brand-dark);
      font-size: var(--type-caption);
      font-weight: 600;
      margin-bottom: var(--space-md);
    }
    .auth-title {
      font-size: var(--type-h1);
      font-weight: 700;
      color: var(--color-ink);
      letter-spacing: 0.5px;
    }
    .auth-sub {
      font-size: var(--type-body);
      color: var(--color-ink-secondary);
      margin-top: var(--space-xs);
      line-height: 1.6;
    }

    /* 权限对照折叠卡 */
    .perm {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      backdrop-filter: var(--backdrop-glass);
      -webkit-backdrop-filter: var(--backdrop-glass);
      border-radius: 24px;
      padding: var(--space-md) var(--space-lg);
      box-shadow: var(--shadow-sm);
      margin-bottom: var(--space-xl);
    }
    .perm-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      color: var(--color-ink);
      font-size: var(--type-body);
      font-weight: 600;
    }
    .perm-head .chev {
      transition: transform 250ms var(--ease-soft);
      color: var(--color-ink-muted);
    }
    .perm.open .perm-head .chev { transform: rotate(180deg); }
    .perm-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 280ms var(--ease-soft);
    }
    .perm.open .perm-body { max-height: 320px; }
    .perm-list { margin-top: var(--space-md); display: flex; flex-direction: column; gap: var(--space-sm); }
    .perm-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: var(--type-body);
      color: var(--color-ink-secondary);
    }
    .perm-ic {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: grid; place-items: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .perm-ic.ok { background: var(--color-success-bg); color: var(--color-success); }
    .perm-ic.no { background: var(--color-error-bg); color: var(--color-error); }
    .perm-row b { color: var(--color-ink); font-weight: 600; }

    /* 双入口 */
    .auth-actions { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-md); }
    .btn-warm {
      background: linear-gradient(135deg, #F7A76C 0%, #F8C6A0 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(246, 162, 118, 0.40);
    }
    .btn-warm:hover { filter: brightness(1.03); }
    .btn-warm:active { transform: scale(0.98); }
    .btn-wechat {
      background: var(--color-surface);
      color: var(--color-ink);
      border: 1px solid var(--color-border);
      backdrop-filter: var(--backdrop-glass);
      -webkit-backdrop-filter: var(--backdrop-glass);
      box-shadow: var(--shadow-sm);
    }
    .btn-wechat:hover { background: var(--color-surface-elevated); }
    .btn-wechat:active { transform: scale(0.98); }
    .btn-wechat .ic { color: #7ECC6B; margin-right: 6px; }
    .auth-hint {
      text-align: center;
      font-size: var(--type-nano);
      color: var(--color-ink-muted);
      margin-top: var(--space-xs);
      letter-spacing: 0.4px;
    }

    /* ========== 游客身份点受限 Tab 后的「强制登录」模式 ========== */
    /* 通过 body[data-required-login="true"] 整体切换；
       隐藏游客入口、把微信登录升级为主按钮、加「返回上一页」次按钮。 */
    body[data-required-login="true"] #guestBtn { display: none; }

    body[data-required-login="true"] #wechatBtn {
      background: linear-gradient(135deg, #F7A76C 0%, #F8C6A0 100%);
      color: #fff;
      border: none;
      box-shadow: 0 6px 20px rgba(246, 162, 118, 0.40);
      font-weight: 600;
    }
    body[data-required-login="true"] #wechatBtn .ic { color: #FFFFFF; }
    body[data-required-login="true"] #wechatBtn:hover { filter: brightness(1.04); }
    body[data-required-login="true"] #wechatBtn:active { transform: scale(0.98); }

    .auth-back-link {
      display: none;
      text-align: center;
      margin-top: var(--space-sm);
      font-size: var(--type-caption);
      color: var(--color-ink-muted);
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 8px;
      width: 100%;
    }
    .auth-back-link:hover { color: var(--color-ink-secondary); }
    body[data-required-login="true"] .auth-back-link { display: block; }

    /* 强制登录模式的提示卡（位于 perm 卡下方） */
    .need-login-tip {
      display: none;
      align-items: flex-start;
      gap: 10px;
      padding: 12px var(--space-md);
      margin-bottom: var(--space-xl);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(247,167,108,0.10), rgba(248,198,160,0.10));
      border: 1px solid rgba(247,167,108,0.32);
      color: var(--color-ink-secondary);
      font-size: var(--type-caption);
      line-height: 1.55;
    }
    .need-login-tip .ic {
      width: 28px; height: 28px;
      border-radius: 50%;
      flex-shrink: 0;
      display: grid; place-items: center;
      background: linear-gradient(135deg,#FFD8B5,#FBC0C6);
      color: #9A4D5C;
      font-size: 14px;
    }
    .need-login-tip b { color: var(--color-brand-dark); font-weight: 600; }
    body[data-required-login="true"] .need-login-tip { display: flex; }

    /* 受限触发登录引导弹层 */
    .sheet-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-md); }
    .login-guide-text { font-size: var(--type-body); color: var(--color-ink-secondary); line-height: 1.65; }
    .login-guide-text b { color: var(--color-brand-dark); }
  </style>
  <script>
    // —— 无闪烁深色模式 bootstrap ——
    (function () {
      try {
        var m = localStorage.getItem('xj_theme_mode') || 'system';
        var dark = (m === 'dark') || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme-mode', m);
      } catch (e) {}
    })();
    // —— 强制登录模式：游客身份点击「足迹 / 我的」等受限 Tab 后跳转过来时启用 ——
    // 通过 ?from=xxx 识别；页面自动隐藏游客入口、升级微信登录为唯一主按钮。
    (function () {
      var params;
      try { params = new URLSearchParams(window.location.search); } catch (e) { params = null; }
      var from = params && params.get('from');
      if (!from) return; // 冷启动模式不需要切换样式

      document.body.setAttribute('data-required-login', 'true');

      // 文案切换
      var badge = document.querySelector('.auth-badge');
      if (badge) badge.innerHTML = '🔒 需要登录';
      var title = document.querySelector('.auth-title');
      if (title) title.textContent = '请使用微信登录继续';
      var sub = document.querySelector('.auth-sub');
      if (sub) sub.textContent = '先用微信账号解锁「足迹 · 我的」等高级功能';
      var wechatLabel = document.getElementById('wechatBtnLabel');
      if (wechatLabel) wechatLabel.textContent = '微信一键登录（解锁访问）';

      // 友好化目标页名
      var targetMap = {
        'footprint.html': '温柔足迹',
        'me.html': '我的主页',
        'release.html': '发布盲盒',
        'settings.html': '设置'
      };
      var targetEl = document.getElementById('needLoginTarget');
      if (targetEl) targetEl.textContent = targetMap[from] || ('「' + from + '」');

      // 「返回上一页」：退回到 index.html（不回足迹/我的，否则会再次被守卫拦截）
      var back = document.getElementById('authBack');
      if (back) {
        back.addEventListener('click', function () {
          try { history.back(); } catch (e) { window.location.href = 'index.html'; }
        });
      }
    })();
  </script>
</head>
<body class="auth">
  <div class="auth-head">
    <span class="auth-badge">🔓 游客模式</span>
    <h1 class="auth-title">准备好了吗？</h1>
    <p class="auth-sub">先不登录也能逛逛街角的温柔</p>
  </div>

  <!-- 权限对照折叠卡 -->
  <div class="perm open" id="perm">
    <button class="perm-head" id="permHead" aria-expanded="true">
      <span>游客权限说明</span>
      <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <div class="perm-body">
      <div class="perm-list">
        <div class="perm-row"><span class="perm-ic ok">✓</span><span><b>可</b>：浏览罗盘 · 拾取 · 接收温柔</span></div>
        <div class="perm-row"><span class="perm-ic no">×</span><span><b>限</b>：发布盲盒 · 查看温柔足迹 · 生成 AIGC 图卷</span></div>
      </div>
    </div>
  </div>

  <!-- 强制登录模式专属提示（默认隐藏） -->
  <div class="need-login-tip" id="needLoginTip" role="note" aria-live="polite">
    <span class="ic" aria-hidden="true">🔒</span>
    <span><b>该功能仅向登录用户开放</b><br>正在请求访问「<span id="needLoginTarget">该功能</span>」——请用微信账号一键登录以继续。</span>
  </div>

  <!-- 双入口 -->
  <div class="auth-actions">
    <a href="index.html" class="btn btn-warm btn-block" id="guestBtn" style="text-decoration:none;">🟠 以游客身份体验</a>
    <button class="btn btn-wechat btn-block" id="wechatBtn">
      <span class="ic">💬</span><span id="wechatBtnLabel">微信登录（解锁发布）</span>
    </button>
    <p class="auth-hint">微信登录仅获取 openid，不强制手机号与位置</p>
    <button class="auth-back-link" id="authBack" type="button" aria-label="返回上一页">← 返回上一页</button>
  </div>

  <!-- 受限触发：登录引导弹层（演示：微信登录） -->
  <div class="modal-backdrop" id="loginBackdrop"></div>
  <div class="modal-sheet" id="loginSheet" role="dialog" aria-modal="true" aria-label="微信登录">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <h2 class="text-h2" style="font-weight:600;">微信登录</h2>
      <button class="sheet-close" id="loginClose" aria-label="关闭">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <p class="login-guide-text">（演示）授权后将以 <b>openid</b> 绑定账号，解锁 <b>发布盲盒 / 温柔足迹 / AIGC 图卷</b>。位置等敏感权限按需触发。</p>
    <div style="display:flex; gap:var(--space-md); margin-top: var(--space-lg);">
      <button class="btn btn-secondary btn-block" id="loginCancel">取消</button>
      <button class="btn btn-primary btn-block" id="loginConfirm">确认登录</button>
    </div>
  </div>

  <script src="js/themes.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/auth-flow.js"></script>
  <script>
    (function () {
      // 权限卡折叠（点击不跳屏，仅展开/收起）
      var perm = document.getElementById('perm');
      document.getElementById('permHead').addEventListener('click', function () {
        var open = perm.classList.toggle('open');
        this.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      // 游客入口：写游客态 → 情绪罗盘
      document.getElementById('guestBtn').addEventListener('click', function () {
        try { localStorage.setItem('xj_guest', '1'); localStorage.setItem('onboarding_done', '1'); } catch (e) {}
      });

      // 微信登录：打开登录引导弹层（受限触发模式）
      var backdrop = document.getElementById('loginBackdrop');
      var sheet = document.getElementById('loginSheet');
      function openSheet() { backdrop.classList.add('open'); sheet.classList.add('open'); }
      function closeSheet() { backdrop.classList.remove('open'); sheet.classList.remove('open'); }

      document.getElementById('wechatBtn').addEventListener('click', openSheet);
      document.getElementById('loginClose').addEventListener('click', closeSheet);
      document.getElementById('loginCancel').addEventListener('click', closeSheet);
      backdrop.addEventListener('click', closeSheet);

      document.getElementById('loginConfirm').addEventListener('click', function () {
        try { localStorage.setItem('xj_guest', '0'); localStorage.setItem('xj_account', '1'); localStorage.setItem('onboarding_done', '1'); } catch (e) {}
        // 首次登录判断：首次用户先展示欢迎内容，确认后再记录登录并进入
        if (window.XJAuth && XJAuth.isFirstLogin()) {
          XJAuth.handleFirstLogin(function () {
            XJAuth.markLogin();
            window.location.href = 'index.html';
          });
        } else {
          XJAuth.markLogin();
          window.location.href = 'index.html';
        }
      });
    })();
  </script>
</body>
</html>
