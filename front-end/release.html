<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F8F6FC">
  <title>街角情绪盲盒 · 种下一个温柔</title>
  <link rel="stylesheet" href="css/design-system.css">
  <style>
    .release-page { min-height: 100vh; }
    .release-header { padding: var(--space-md); display: flex; align-items: center; justify-content: space-between; }
    .section-title { margin-bottom: var(--space-sm); display: flex; align-items: center; gap: var(--space-xs); }
    .section-title .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-primary); }
    .micro-climate {
      display: flex;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }
    .climate-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: 8px 14px;
      border-radius: 9999px;
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      backdrop-filter: var(--backdrop-glass);
      font-size: var(--type-caption);
      color: var(--color-ink-secondary);
    }
  </style>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('xj_theme_mode') || 'system';
        var dark = (m === 'dark') || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme-mode', m);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="release-page bg-warm" id="release-page">
    <div class="status-bar-spacer"></div>

    <!-- 顶部导航 -->
    <header class="release-header container">
      <a href="index.html" class="btn-icon" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </a>
      <div class="page-title page-title--center">
        <p class="page-title__en">GENTLE RELEASE</p>
        <h1 class="page-title__cn text-h2">种下一个温柔盲盒</h1>
      </div>
      <button class="btn-icon" aria-label="更多">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
      </button>
    </header>

    <form id="release-form" class="container" style="padding-bottom: calc(var(--tab-bar-height) + var(--space-3xl) + var(--safe-bottom));">
      <!-- 媒体捕捉 -->
      <section style="margin-bottom: var(--space-xl);">
        <div class="section-title">
          <span class="dot"></span>
          <h2 class="text-h3">留下一个瞬间</h2>
        </div>
        <p class="text-caption text-secondary" style="margin-bottom: var(--space-md);">拍一张照片，或录一段 5 秒的环境音（二选一）</p>

        <div class="media-capture" id="media-capture" data-state="empty">
          <!-- 空状态 -->
          <div class="capture-empty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            <span class="text-body text-secondary">点击拍照或录音</span>
          </div>

          <!-- 图片预览（上传后叠加在示意区域） -->
          <div class="capture-preview capture-image">
            <img id="capture-image-preview" src="" alt="上传的照片">
            <div class="capture-overlay"></div>
            <button type="button" class="capture-remove" id="btn-remove-image" aria-label="移除图片">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>

          <!-- 录音状态 -->
          <div class="capture-preview capture-audio">
            <div class="audio-wave" id="audio-wave" aria-hidden="true">
              <!-- 12 根波形条由 JS 动态生成 -->
            </div>
            <div class="audio-info">
              <span class="audio-time" id="audio-time">00:00 / 00:05</span>
              <span class="audio-status" id="audio-status">准备录音</span>
            </div>
            <button type="button" class="audio-play" id="btn-play-audio" aria-label="播放录音" disabled>
              <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <svg class="icon-pause" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>
            </button>
            <button type="button" class="capture-remove" id="btn-remove-audio" aria-label="移除录音">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>

        <div class="media-actions" style="margin-top: var(--space-md);">
          <button type="button" class="btn btn-secondary" id="btn-camera">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
            拍照
          </button>
          <button type="button" class="btn btn-secondary" id="btn-audio">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            录音 5s
          </button>
        </div>
      </section>

      <!-- 情绪色谱 -->
      <section style="margin-bottom: var(--space-xl);">
        <div class="section-title">
          <span class="dot"></span>
          <h2 class="text-h3">选择情绪颜色</h2>
        </div>
        <p class="text-caption text-secondary" style="margin-bottom: var(--space-md);">必填，这决定光点在地图上的颜色</p>

        <input type="hidden" name="mood" value="">
        <div class="mood-options">
          <div class="mood-option selected" data-mood="relaxed" role="radio" aria-checked="true" tabindex="0">
            <div class="mood-dot relaxed"></div>
            <span class="text-caption">松弛</span>
          </div>
          <div class="mood-option" data-mood="sweet" role="radio" aria-checked="false" tabindex="0">
            <div class="mood-dot sweet"></div>
            <span class="text-caption">微甜</span>
          </div>
          <div class="mood-option" data-mood="daydream" role="radio" aria-checked="false" tabindex="0">
            <div class="mood-dot daydream"></div>
            <span class="text-caption">发呆</span>
          </div>
          <div class="mood-option" data-mood="warm" role="radio" aria-checked="false" tabindex="0">
            <div class="mood-dot warm"></div>
            <span class="text-caption">暖意</span>
          </div>
        </div>
      </section>

      <!-- 文字随笔 -->
      <section style="margin-bottom: var(--space-xl);">
        <div class="section-title">
          <span class="dot"></span>
          <h2 class="text-h3">留一句轻柔的话</h2>
        </div>
        <p class="text-caption text-secondary" style="margin-bottom: var(--space-md);">选填，不超过 140 字</p>

        <div style="position:relative;">
          <textarea class="textarea" name="note" placeholder="把此刻的心情，写给下一位路过的人…" maxlength="140"></textarea>
          <span class="text-caption" data-char-counter="" data-max="140" style="position:absolute; right: var(--space-sm); bottom: var(--space-sm);">0/140</span>
        </div>
      </section>

      <!-- 微气候关联 -->
      <section style="margin-bottom: var(--space-xl);">
        <div class="section-title">
          <span class="dot"></span>
          <h2 class="text-h3">此时此地</h2>
        </div>
        <p class="text-caption text-secondary" style="margin-bottom: var(--space-md);">坐标与天气会自动关联，72 小时后自然消散</p>

        <div class="micro-climate">
          <span class="climate-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            上海市 · 静安区
          </span>
          <span class="climate-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            24°C 微风
          </span>
          <span class="climate-chip">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            18:42
          </span>
        </div>
      </section>

      <!-- 提交按钮 -->
      <button type="submit" class="btn btn-primary btn-block" style="margin-bottom: var(--space-lg); min-height: 52px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        留在此时此地
      </button>

      <p class="text-caption text-muted" style="text-align:center; margin-bottom: var(--space-xl);">
        盲盒将以温柔代号发布，不会暴露你的身份
      </p>
    </form>
  </main>

  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/editor-injected.js"></script>
  <script src="js/theme-toggle.js"></script>
</body>
</html>
