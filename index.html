<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F8F6FC">
  <title>街角情绪盲盒 · 情绪罗盘</title>
  <link rel="stylesheet" href="css/design-system.css">
  <script>
    (function () {
      try {
        var m = localStorage.getItem('xj_theme_mode') || 'system';
        var dark = (m === 'dark') || (m !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme-mode', m);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main class="page bg-canvas" id="home-page">
    <!-- 状态栏占位 -->
    <div class="status-bar-spacer"></div>

    <!-- 顶部导航 -->
    <header class="container" style="display:flex; justify-content:space-between; align-items:center; padding-top: var(--space-md); padding-bottom: var(--space-md); position:relative; z-index: var(--z-sticky);">
      <!-- 左侧占位：保持顶部三栏布局视觉平衡 -->
      <span class="header-placeholder" aria-hidden="true"></span>

      <div class="top-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <span id="time-greeting">清晨</span>散步 · 上海
      </div>

      <a href="settings.html" class="btn-icon" aria-label="设置">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </a>
    </header>

    <!-- 英雄区 · 双语标题：英文标识 + 中文品牌主标 + 副文案 -->
    <section class="container" style="text-align:center; padding-top: var(--space-lg); position:relative; z-index: var(--z-content);">
      <p class="text-nano" style="margin-bottom: var(--space-md);">WELCOME, 散步者</p>
      <div class="page-title page-title--center" style="margin-bottom: var(--space-md);">
        <p class="page-title__en">EMOTION BLIND BOX</p>
        <h1 class="page-title__cn text-hero">街角情绪盲盒</h1>
      </div>
      <p class="text-body-lg text-secondary" style="max-width: 280px; margin: 0 auto;">把 15 分钟步行圈<br>变成有温度的情绪空间</p>
    </section>

    <!-- 情绪罗盘画布 -->
    <section class="compass-canvas" id="compass-canvas" role="button" tabindex="0" aria-label="切换视图模式：当前 15min 全圈，点击切换 50m 近场">
      <!-- 背景：多层径向光晕叠加（外层 .compass-glow 用于极轻微色相漂移，让纵深更"活"） -->
      <div class="compass-glow" aria-hidden="true">
        <div class="compass-ripple compass-ripple--bg compass-ripple--bg-1" data-ripple-index="0"></div>
        <div class="compass-ripple compass-ripple--bg compass-ripple--bg-2" data-ripple-index="0"></div>
        <div class="compass-ripple compass-ripple--bg compass-ripple--bg-3" data-ripple-index="0"></div>
      </div>
      <!-- 水波纹：6 层不同速率/半径/透明度 -->
      <div class="compass-ripple compass-ripple--ring compass-ripple--1" data-ripple-index="1"></div>
      <div class="compass-ripple compass-ripple--ring compass-ripple--2" data-ripple-index="2"></div>
      <div class="compass-ripple compass-ripple--ring compass-ripple--3" data-ripple-index="3"></div>
      <div class="compass-ripple compass-ripple--ring compass-ripple--4" data-ripple-index="4"></div>
      <div class="compass-ripple compass-ripple--ring compass-ripple--5" data-ripple-index="5"></div>
      <div class="compass-ripple compass-ripple--ring compass-ripple--6" data-ripple-index="6"></div>
      <div class="near-field-ring" aria-hidden="true"></div>

      <!-- 当前位置 -->
      <div class="compass-center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      </div>

      <!-- 呼吸光点由 JS 动态生成 -->
    </section>
    <p class="compass-scope" id="compass-scope" aria-live="polite">15min 步行圈 · 点击切换近场</p>

    <!-- 底部信息卡片 -->
    <section class="container" style="position:relative; z-index: var(--z-content); margin-top: var(--space-lg);">
      <div class="card-glass animate-fade-in-up" style="text-align:center;">
        <div class="text-nano" style="margin-bottom: var(--space-xs);">NEARBY</div>
        <p class="text-h2" style="margin-bottom: var(--space-sm);">附近还有 <span style="color: var(--color-primary);">3</span> 份温柔</p>
        <p class="text-caption text-secondary" style="margin-bottom: var(--space-md);">继续散步，靠近光点时手机会轻轻震动</p>
        <a href="pickup.html" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
          去拾取温柔
        </a>
      </div>
    </section>

    <!-- 浮动发布按钮 -->
    <a href="release.html" class="btn-fab" style="position:fixed; right: var(--space-lg); bottom: calc(var(--tab-bar-height) + var(--space-xl) + var(--safe-bottom)); z-index: var(--z-sticky);" aria-label="种下一个温柔盲盒">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </a>

    <!-- 底部 Tab 栏 -->
    <nav class="tab-bar" role="tablist" aria-label="主导航">
      <span class="tab-indicator" aria-hidden="true"></span>
      <a href="index.html" class="tab-item active" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        罗盘
      </a>
      <a href="footprint.html" class="tab-item" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        足迹
      </a>
      <a href="me.html" class="tab-item" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        我的
      </a>
    </nav>
  </main>

  <script src="js/themes.js"></script>
  <script src="js/app.js"></script>
  <script src="js/editor-injected.js"></script>
  <script src="js/theme-toggle.js"></script>
</body>
</html>
